<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="amai! illustratie: menselijke expertise gecombineerd met AI">
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="#FFFFFF" stroke="#E9EEF6" stroke-width="2"/>

  <!-- human -->
  <circle cx="250" cy="180" r="76" fill="#93E6BE"/>
  <circle cx="250" cy="152" r="26" fill="#16233D"/>
  <path d="M204 234 a46 46 0 0 1 92 0" fill="#16233D"/>

  <!-- plus -->
  <text x="400" y="201" text-anchor="middle" font-family="Archivo Black, Arial, sans-serif" font-weight="800" font-size="66" fill="#16233D">+</text>

  <!-- AI -->
  <rect x="488" y="128" width="196" height="104" rx="22" fill="#16233D"/>
  <text x="586" y="199" text-anchor="middle" font-family="Archivo Black, Arial, sans-serif" font-weight="800" font-size="58" fill="#93E6BE">AI</text>

  <!-- equals -->
  <text x="780" y="201" text-anchor="middle" font-family="Archivo Black, Arial, sans-serif" font-weight="800" font-size="66" fill="#16233D">=</text>

  <!-- result -->
  <circle cx="940" cy="180" r="76" fill="#93E6BE"/>
  <path d="M904 182 l24 26 l46 -54" fill="none" stroke="#16233D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

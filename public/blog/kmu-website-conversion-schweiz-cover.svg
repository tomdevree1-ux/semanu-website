<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Conversion Lücke: 71 Prozent der schwächsten KMU Websites erreichen bei Conversion weniger als 5 von 10 Punkten">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233D"/><stop offset="1" stop-color="#0E1B33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93E6BE" stop-opacity="0.28"/><stop offset="1" stop-color="#93E6BE" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:'Space Mono','DejaVu Sans Mono',monospace}
      .sans{font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
      .black{font-family:'Archivo Black',Arial,sans-serif;font-weight:800}
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="330" fill="url(#glow)"/>
  <text x="80" y="92" class="mono" font-size="19" letter-spacing="5" fill="#93E6BE">KMU WEBSITE BENCHMARK · CONVERSION</text>
  <text x="78" y="168" class="black" font-size="56" fill="#FFFFFF">Besucher kommen<tspan fill="#93E6BE">.</tspan></text>
  <text x="78" y="232" class="black" font-size="56" fill="#FFFFFF">Kunden werden sie nicht<tspan fill="#93E6BE">.</tspan></text>

  <!-- big number + mini bars -->
  <g transform="translate(80,300)" class="sans">
    <text x="0" y="0" font-size="15" fill="#C7D0DE">Conversion Punkte der 638 schwächsten Seiten (0 bis 10)</text>
    <g transform="translate(0,22)">
      <text x="0" y="15" font-size="16" fill="#F4F6FA">3 oder tiefer</text>
      <rect x="200" y="2" width="150" height="18" rx="4" fill="#D1453B"/>
      <text x="362" y="16" class="black" font-size="15" fill="#F4F6FA">25%</text>
    </g>
    <g transform="translate(0,52)">
      <text x="0" y="15" font-size="16" fill="#F4F6FA">3 bis 5</text>
      <rect x="200" y="2" width="276" height="18" rx="4" fill="#E8A13A"/>
      <text x="488" y="16" class="black" font-size="15" fill="#F4F6FA">46%</text>
    </g>
    <g transform="translate(0,82)">
      <text x="0" y="15" font-size="16" fill="#F4F6FA">5 oder mehr</text>
      <rect x="200" y="2" width="174" height="18" rx="4" fill="#93E6BE"/>
      <text x="386" y="16" class="black" font-size="15" fill="#F4F6FA">29%</text>
    </g>
    <text x="0" y="132" font-size="14" fill="#C7D0DE">71% unter 5 Punkten · Schnitt 4,0 von 10 · zweitschwächste Kategorie der Studie</text>
  </g>

  <text x="80" y="470" class="black" font-size="30" fill="#F4F6FA">semanu <tspan class="sans" font-weight="400" font-size="20" fill="#F4F6FA" opacity="0.7">2292 KMU Websites bewertet</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Balkendiagramm der Conversion Punkte: 25 Prozent bei 3 oder tiefer, 46 Prozent zwischen 3 und 5, 29 Prozent bei 5 oder mehr."><rect width="1000" height="230" fill="#FFFFFF"/><text x="250" y="30" style="font-family:Arial,Helvetica,sans-serif" font-size="13.5" font-weight="700" fill="#16233D">Conversion Punkte der 638 Seiten mit dem grössten Handlungsbedarf</text><rect x="250" y="55" width="640" height="26" rx="4" fill="#F4F6FA"/><rect x="250" y="55" width="160.0" height="26" rx="4" fill="#D1453B"/><text x="232" y="73" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif" font-size="13.5" fill="#16233D">3 Punkte oder tiefer</text><text x="418.0" y="73" style="font-family:Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#16233D">25%</text><rect x="250" y="99" width="640" height="26" rx="4" fill="#F4F6FA"/><rect x="250" y="99" width="294.4" height="26" rx="4" fill="#E8A13A"/><text x="232" y="117" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif" font-size="13.5" fill="#16233D">3 bis 5 Punkte</text><text x="552.4" y="117" style="font-family:Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#16233D">46%</text><rect x="250" y="143" width="640" height="26" rx="4" fill="#F4F6FA"/><rect x="250" y="143" width="185.6" height="26" rx="4" fill="#93E6BE"/><text x="232" y="161" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif" font-size="13.5" fill="#16233D">5 Punkte oder mehr</text><text x="443.6" y="161" style="font-family:Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#16233D">29%</text><text x="250" y="193" style="font-family:Arial,Helvetica,sans-serif" font-size="11" fill="#6B7684">71% liegen unter 5 von 10. Schnitt: 4,0</text></svg>
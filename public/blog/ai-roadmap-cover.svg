<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="semanu illustratie: een AI-roadmap als route van doelen via mijlpalen naar technologie">
  <rect width="1200" height="520" fill="#16233D"/>
  <circle cx="1080" cy="70" r="240" fill="#F4F6FA" opacity="0.07"/>
  <circle cx="120" cy="470" r="200" fill="#93E6BE" opacity="0.12"/>

  <!-- route -->
  <path d="M170 410 C 300 410, 300 300, 420 300 S 560 190, 680 190 S 840 300, 960 200 S 1040 110, 1060 110"
        fill="none" stroke="#F4F6FA" stroke-opacity="0.28" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>

  <!-- milestones -->
  <g fill="#16233D" stroke="#93E6BE" stroke-width="3">
    <circle cx="420" cy="300" r="26"/>
    <circle cx="680" cy="190" r="26"/>
    <circle cx="882" cy="241" r="26"/>
  </g>

  <!-- start: goals -->
  <circle cx="170" cy="410" r="44" fill="#93E6BE"/>
  <circle cx="170" cy="410" r="24" fill="none" stroke="#16233D" stroke-width="5"/>
  <circle cx="170" cy="410" r="8" fill="#16233D"/>

  <!-- destination: technology -->
  <rect x="1022" y="72" width="76" height="76" rx="14" fill="none" stroke="#F4F6FA" stroke-opacity="0.45" stroke-width="3"/>
  <g stroke="#F4F6FA" stroke-opacity="0.45" stroke-width="3">
    <line x1="1060" y1="96" x2="1060" y2="124"/>
    <line x1="1046" y1="110" x2="1074" y2="110"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="semanu illustration: an app that works in the demo shows five hidden risks after go-live">
  <rect width="1200" height="520" fill="#16233D"/>
  <circle cx="1080" cy="70" r="240" fill="#F4F6FA" opacity="0.07"/>
  <circle cx="120" cy="470" r="200" fill="#93E6BE" opacity="0.12"/>

  <!-- left: the demo, a clean window -->
  <g transform="translate(150,120)">
    <rect x="0" y="0" width="330" height="270" rx="18" fill="#FFFFFF"/>
    <line x1="0" y1="50" x2="330" y2="50" stroke="#E9EEF6" stroke-width="2"/>
    <circle cx="28" cy="25" r="7" fill="#E9EEF6"/>
    <circle cx="52" cy="25" r="7" fill="#E9EEF6"/>
    <circle cx="76" cy="25" r="7" fill="#E9EEF6"/>
    <g stroke="#C9D2E0" stroke-width="10" stroke-linecap="round">
      <line x1="40" y1="96" x2="220" y2="96"/>
      <line x1="40" y1="134" x2="270" y2="134"/>
      <line x1="40" y1="172" x2="180" y2="172"/>
    </g>
    <rect x="40" y="206" width="120" height="36" rx="10" fill="#16233D"/>
    <circle cx="268" cy="224" r="26" fill="#93E6BE"/>
    <path d="M255 224 L264 233 L282 214" fill="none" stroke="#16233D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- go-live arrow -->
  <g stroke="#93E6BE" stroke-width="4" fill="none">
    <line x1="510" y1="255" x2="672" y2="255" stroke-dasharray="12 10"/>
  </g>
  <path d="M668 241 L694 255 L668 269 Z" fill="#93E6BE"/>

  <!-- right: the same window after go-live, five hidden risks -->
  <g transform="translate(720,120)">
    <rect x="0" y="0" width="330" height="270" rx="18" fill="#16233D" stroke="#F4F6FA" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="0" y1="50" x2="330" y2="50" stroke="#F4F6FA" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="28" cy="25" r="7" fill="#F4F6FA" opacity="0.25"/>
    <circle cx="52" cy="25" r="7" fill="#F4F6FA" opacity="0.25"/>
    <circle cx="76" cy="25" r="7" fill="#F4F6FA" opacity="0.25"/>
    <g fill="#93E6BE">
      <path d="M40 98 L52 76 L64 98 Z"/>
      <path d="M40 136 L52 114 L64 136 Z"/>
      <path d="M40 174 L52 152 L64 174 Z"/>
      <path d="M40 212 L52 190 L64 212 Z"/>
      <path d="M40 250 L52 228 L64 250 Z"/>
    </g>
    <g stroke="#F4F6FA" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round">
      <line x1="84" y1="90" x2="250" y2="90"/>
      <line x1="84" y1="128" x2="290" y2="128"/>
      <line x1="84" y1="166" x2="220" y2="166"/>
      <line x1="84" y1="204" x2="270" y2="204"/>
      <line x1="84" y1="242" x2="200" y2="242"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="semanu illustration: business data flowing into a quality ring that is 70 percent filled">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233D"/>
      <stop offset="1" stop-color="#0E1B33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93E6BE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#93E6BE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="360" fill="url(#glow)"/>
  <circle cx="150" cy="470" r="240" fill="url(#glow)"/>

  <!-- data cells: clean, missing (dashed) and faded records -->
  <g>
    <rect x="110" y="110" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="172" y="110" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="235.5" y="111.5" width="41" height="41" rx="8" fill="none" stroke="#93E6BE" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
    <rect x="296" y="110" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="358" y="110" width="44" height="44" rx="8" fill="#F4F6FA" opacity="0.14"/>
    <rect x="420" y="110" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="111.5" y="173.5" width="41" height="41" rx="8" fill="none" stroke="#93E6BE" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
    <rect x="172" y="172" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="234" y="172" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="296" y="172" width="44" height="44" rx="8" fill="#F4F6FA" opacity="0.14"/>
    <rect x="358" y="172" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="420" y="172" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="110" y="234" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="172" y="234" width="44" height="44" rx="8" fill="#F4F6FA" opacity="0.14"/>
    <rect x="234" y="234" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="296" y="234" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="359.5" y="235.5" width="41" height="41" rx="8" fill="none" stroke="#93E6BE" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
    <rect x="420" y="234" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="110" y="296" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="172" y="296" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="235.5" y="297.5" width="41" height="41" rx="8" fill="none" stroke="#93E6BE" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
    <rect x="296" y="296" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="358" y="296" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="420" y="296" width="44" height="44" rx="8" fill="#F4F6FA" opacity="0.14"/>
    <rect x="110" y="358" width="44" height="44" rx="8" fill="#F4F6FA" opacity="0.14"/>
    <rect x="172" y="358" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="234" y="358" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="296" y="358" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="359.5" y="359.5" width="41" height="41" rx="8" fill="none" stroke="#93E6BE" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
    <rect x="420" y="358" width="44" height="44" rx="8" fill="#93E6BE" opacity="0.85"/>
  </g>

  <!-- flows into the ring -->
  <path d="M500 150 C 590 150, 620 262, 700 262" fill="none" stroke="#93E6BE" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M500 230 C 590 230, 620 262, 700 262" fill="none" stroke="#93E6BE" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M500 300 C 590 300, 620 262, 700 262" fill="none" stroke="#93E6BE" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M500 370 C 590 370, 620 262, 700 262" fill="none" stroke="#93E6BE" stroke-opacity="0.35" stroke-width="2"/>

  <!-- quality ring, about 70 percent -->
  <circle cx="880" cy="262" r="150" fill="none" stroke="#F4F6FA" stroke-opacity="0.12" stroke-width="26"/>
  <circle cx="880" cy="262" r="150" fill="none" stroke="#93E6BE" stroke-width="26" stroke-dasharray="659.7 942.5" transform="rotate(-90 880 262)"/>
  <circle cx="880" cy="262" r="96" fill="#93E6BE" opacity="0.10"/>
  <text x="880" y="284" text-anchor="middle" font-family="Archivo Black, Arial, sans-serif" font-weight="800" font-size="64" fill="#FFFFFF">70%</text>

  <!-- seven checks around the ring -->
  <g>
    <circle cx="880.0" cy="60.0" r="9" fill="#93E6BE" stroke="#93E6BE" stroke-width="3"/>
    <circle cx="1037.9" cy="136.1" r="9" fill="#93E6BE" stroke="#93E6BE" stroke-width="3"/>
    <circle cx="1076.9" cy="306.9" r="9" fill="#93E6BE" stroke="#93E6BE" stroke-width="3"/>
    <circle cx="967.6" cy="444.0" r="9" fill="#93E6BE" stroke="#93E6BE" stroke-width="3"/>
    <circle cx="792.4" cy="444.0" r="9" fill="#93E6BE" stroke="#93E6BE" stroke-width="3"/>
    <circle cx="683.1" cy="306.9" r="9" fill="#16233D" stroke="#93E6BE" stroke-width="3"/>
    <circle cx="722.1" cy="136.1" r="9" fill="#16233D" stroke="#93E6BE" stroke-width="3"/>
  </g>
</svg>

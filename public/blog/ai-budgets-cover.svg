<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="semanu illustration: three diverging AI cost scenarios">
  <rect width="1200" height="520" fill="#16233D"/>
  <circle cx="1080" cy="70" r="240" fill="#F4F6FA" opacity="0.07"/>
  <circle cx="120" cy="470" r="200" fill="#93E6BE" opacity="0.12"/>

  <!-- grid -->
  <g stroke="#F4F6FA" stroke-opacity="0.08" stroke-width="1">
    <line x1="240" y1="120" x2="960" y2="120"/>
    <line x1="240" y1="200" x2="960" y2="200"/>
    <line x1="240" y1="280" x2="960" y2="280"/>
    <line x1="240" y1="360" x2="960" y2="360"/>
  </g>
  <!-- axes -->
  <g stroke="#F4F6FA" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M240 90 L240 420 L980 420"/>
  </g>

  <!-- base scenario -->
  <polyline points="260,380 380,376 500,373 620,369 740,366 860,362 940,360" fill="none" stroke="#F4F6FA" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="8 8"/>
  <!-- downside scenario -->
  <polyline points="260,380 380,366 500,346 620,322 740,294 860,262 940,240" fill="none" stroke="#F4F6FA" stroke-opacity="0.7" stroke-width="3"/>
  <!-- growth scenario -->
  <polyline points="260,380 380,356 500,318 620,264 740,198 860,128 940,96" fill="none" stroke="#93E6BE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#16233D" stroke="#93E6BE" stroke-width="3">
    <circle cx="260" cy="380" r="10"/>
    <circle cx="500" cy="318" r="10"/>
    <circle cx="740" cy="198" r="10"/>
  </g>
  <circle cx="940" cy="96" r="18" fill="#93E6BE"/>

  <!-- euro badge -->
  <circle cx="1060" cy="300" r="62" fill="#93E6BE"/>
  <text x="1060" y="320" text-anchor="middle" font-family="Archivo Black, Arial, sans-serif" font-weight="800" font-size="56" fill="#16233D">€</text>
</svg>

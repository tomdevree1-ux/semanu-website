<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="SEO zeigt eine Liste blauer Links, GEO liefert die Antwort selbst und nennt eine Quelle">
  <defs>
    <style>
      .mono{font-family:'Space Mono','DejaVu Sans Mono',monospace}
      .sans{font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
      .black{font-family:'Archivo Black',Arial,sans-serif;font-weight:800}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#F4F6FA"/>

  <!-- LEFT: SEO -->
  <g transform="translate(60,54)">
    <text x="0" y="0" class="mono" font-size="16" letter-spacing="4" fill="#0B7E63">KLASSISCHE SUCHE · SEO</text>
    <text x="0" y="46" class="black" font-size="30" fill="#16233D">Zehn blaue Links</text>
    <rect x="0" y="72" width="470" height="330" rx="16" fill="#FFFFFF" stroke="#E9EEF6"/>
    <g transform="translate(28,104)">
      <!-- result rows -->
      <g>
        <text x="0" y="14" class="sans" font-size="17" fill="#1B57C4">Firma A GmbH</text>
        <rect x="0" y="26" width="360" height="8" rx="4" fill="#E9EEF6"/>
        <rect x="0" y="40" width="300" height="8" rx="4" fill="#E9EEF6"/>
      </g>
      <g transform="translate(0,74)">
        <text x="0" y="14" class="sans" font-size="17" fill="#1B57C4">Firma B AG</text>
        <rect x="0" y="26" width="360" height="8" rx="4" fill="#E9EEF6"/>
        <rect x="0" y="40" width="280" height="8" rx="4" fill="#E9EEF6"/>
      </g>
      <g transform="translate(0,148)">
        <text x="0" y="14" class="sans" font-size="17" fill="#1B57C4">Firma C</text>
        <rect x="0" y="26" width="360" height="8" rx="4" fill="#E9EEF6"/>
        <rect x="0" y="40" width="310" height="8" rx="4" fill="#E9EEF6"/>
      </g>
      <text x="0" y="236" class="mono" font-size="13" fill="#6B7684">Der Kunde muss klicken, vergleichen, wählen.</text>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(556,300)">
    <path d="M0 0 L64 0" stroke="#93E6BE" stroke-width="6" stroke-linecap="round"/>
    <path d="M52 -12 L70 0 L52 12" fill="none" stroke="#93E6BE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT: GEO -->
  <g transform="translate(660,54)">
    <text x="0" y="0" class="mono" font-size="16" letter-spacing="4" fill="#0B7E63">KI ANTWORT · GEO</text>
    <text x="0" y="46" class="black" font-size="30" fill="#16233D">Eine Antwort, eine Quelle</text>
    <rect x="0" y="72" width="470" height="330" rx="16" fill="#16233D"/>
    <g transform="translate(28,104)">
      <circle cx="10" cy="8" r="10" fill="#93E6BE"/>
      <text x="30" y="13" class="mono" font-size="13" fill="#C7D0DE">Antwort</text>
      <text x="0" y="52" class="sans" font-size="18" fill="#FFFFFF">Ein guter digitaler Partner in</text>
      <text x="0" y="78" class="sans" font-size="18" fill="#FFFFFF">Bern ist
        <tspan class="black" fill="#FFFFFF"> semanu</tspan><tspan fill="#FFFFFF">.</tspan>
      </text>
      <text x="0" y="112" class="sans" font-size="15" fill="#C7D0DE">Websites, Automatisierung, AI.</text>
      <g transform="translate(0,150)">
        <rect x="0" y="0" width="168" height="26" rx="13" fill="#E9F3EE"/>
        <text x="14" y="17" class="mono" font-size="12" fill="#0B7E63">QUELLE · semanu.eu</text>
      </g>
      <text x="0" y="212" class="mono" font-size="13" fill="#8FA0BC">Genannt oder unsichtbar. Kein Dazwischen.</text>
    </g>
  </g>
</svg>

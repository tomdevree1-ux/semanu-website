<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Branchen Website Vergleich: Coiffeure am schwächsten, Web und Marketing am stärksten">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233D"/><stop offset="1" stop-color="#0E1B33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93E6BE" stop-opacity="0.28"/><stop offset="1" stop-color="#93E6BE" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:'Space Mono','DejaVu Sans Mono',monospace}
      .sans{font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
      .black{font-family:'Archivo Black',Arial,sans-serif;font-weight:800}
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="330" fill="url(#glow)"/>
  <text x="80" y="92" class="mono" font-size="19" letter-spacing="5" fill="#93E6BE">KMU WEBSITE BENCHMARK · BRANCHEN</text>
  <text x="78" y="168" class="black" font-size="56" fill="#FFFFFF">Welche Branche hat</text>
  <text x="78" y="232" class="black" font-size="56" fill="#FFFFFF">die schwächste Website<tspan fill="#93E6BE">?</tspan></text>

  <!-- mini ranked bars -->
  <g transform="translate(80,300)" class="sans">
    <text x="0" y="0" font-size="15" fill="#C7D0DE">Durchschnittlicher Handlungsbedarf je Branche (1 wenig, 5 viel)</text>
    <g transform="translate(0,22)">
      <text x="0" y="15" font-size="16" fill="#F4F6FA">Coiffeure</text>
      <rect x="200" y="2" width="470" height="18" rx="4" fill="#D1453B"/>
      <text x="682" y="16" class="black" font-size="15" fill="#F4F6FA">3,4</text>
    </g>
    <g transform="translate(0,52)">
      <text x="0" y="15" font-size="16" fill="#F4F6FA">Treuhand</text>
      <rect x="200" y="2" width="438" height="18" rx="4" fill="#E08A1E"/>
      <text x="650" y="16" class="black" font-size="15" fill="#F4F6FA">3,1</text>
    </g>
    <g transform="translate(0,82)">
      <text x="0" y="15" font-size="16" fill="#F4F6FA">Hotels</text>
      <rect x="200" y="2" width="360" height="18" rx="4" fill="#93E6BE"/>
      <text x="572" y="16" class="black" font-size="15" fill="#F4F6FA">2,6</text>
    </g>
    <g transform="translate(0,112)">
      <text x="0" y="15" font-size="16" fill="#F4F6FA">Web und Marketing</text>
      <rect x="200" y="2" width="300" height="18" rx="4" fill="#93E6BE"/>
      <text x="512" y="16" class="black" font-size="15" fill="#F4F6FA">2,1</text>
    </g>
  </g>

  <text x="80" y="470" class="black" font-size="30" fill="#F4F6FA">amai<tspan fill="#93E6BE">!</tspan> <tspan class="sans" font-weight="400" font-size="20" fill="#F4F6FA" opacity="0.7">2292 KMU Websites bewertet</tspan></text>
</svg>

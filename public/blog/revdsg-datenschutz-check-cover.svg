<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="revDSG Check für Schweizer KMU Websites">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233D"/>
      <stop offset="1" stop-color="#0E1B33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93E6BE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#93E6BE" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:'Space Mono','DejaVu Sans Mono',monospace}
      .sans{font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
      .black{font-family:'Archivo Black',Arial,sans-serif;font-weight:800}
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="340" fill="url(#glow)"/>
  <circle cx="140" cy="480" r="230" fill="url(#glow)"/>

  <!-- eyebrow -->
  <text x="80" y="92" class="mono" font-size="20" letter-spacing="6" fill="#93E6BE">REVDSG · SEIT 1. SEPTEMBER 2023</text>
  <!-- headline -->
  <text x="78" y="168" class="black" font-size="60" fill="#FFFFFF">Ist Ihre Website</text>
  <text x="78" y="234" class="black" font-size="60" fill="#FFFFFF">datenschutzkonform<tspan fill="#93E6BE">?</tspan></text>

  <!-- checklist card -->
  <g transform="translate(78,284)">
    <rect x="0" y="0" width="1044" height="180" rx="18" fill="#FFFFFF"/>

    <!-- row 1 ok -->
    <g transform="translate(34,34)">
      <circle cx="13" cy="13" r="13" fill="#E9F3EE"/>
      <path d="M7 13 L11 17 L19 9" fill="none" stroke="#0B7E63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="19" class="sans" font-size="19" fill="#16233D">Datenschutzerklärung passt zur echten Website</text>
    </g>
    <!-- row 2 ok -->
    <g transform="translate(34,76)">
      <circle cx="13" cy="13" r="13" fill="#E9F3EE"/>
      <path d="M7 13 L11 17 L19 9" fill="none" stroke="#0B7E63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="19" class="sans" font-size="19" fill="#16233D">Tracking lädt erst nach der Einwilligung</text>
    </g>
    <!-- row 3 open -->
    <g transform="translate(34,118)">
      <circle cx="13" cy="13" r="13" fill="#FBE9E7"/>
      <path d="M13 7 L13 14" fill="none" stroke="#D1453B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="13" cy="19" r="1.8" fill="#D1453B"/>
      <text x="42" y="19" class="sans" font-size="19" fill="#6B7684">Daten liegen im Ausland, Standort ungeklärt</text>
    </g>

    <!-- side stat -->
    <g transform="translate(690,30)">
      <rect x="0" y="0" width="320" height="122" rx="14" fill="#F4F6FA"/>
      <text x="24" y="40" class="mono" font-size="13" letter-spacing="3" fill="#6B7684">BUSSE BIS</text>
      <text x="24" y="86" class="black" font-size="40" fill="#16233D">250'000<tspan class="mono" font-size="18" fill="#0B7E63"> CHF</tspan></text>
      <text x="24" y="108" class="mono" font-size="12" fill="#6B7684">gegen die verantwortliche Person</text>
    </g>
  </g>
</svg>

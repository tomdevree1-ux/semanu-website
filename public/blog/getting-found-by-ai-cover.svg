<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Eine KI Antwort nennt semanu als Quelle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233D"/>
      <stop offset="1" stop-color="#0E1B33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93E6BE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#93E6BE" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:'Space Mono','DejaVu Sans Mono',monospace}
      .sans{font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
      .black{font-family:'Archivo Black',Arial,sans-serif;font-weight:800}
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="360" fill="url(#glow)"/>
  <circle cx="150" cy="470" r="240" fill="url(#glow)"/>

  <!-- eyebrow -->
  <text x="80" y="92" class="mono" font-size="20" letter-spacing="6" fill="#93E6BE">GEO · GENERATIVE ENGINE OPTIMIZATION</text>
  <!-- headline -->
  <text x="78" y="168" class="black" font-size="62" fill="#FFFFFF">Werden Sie von</text>
  <text x="78" y="236" class="black" font-size="62" fill="#FFFFFF">der KI empfohlen<tspan fill="#93E6BE">?</tspan></text>

  <!-- AI answer card -->
  <g transform="translate(78,286)">
    <rect x="0" y="0" width="1044" height="176" rx="18" fill="#FFFFFF"/>
    <!-- prompt line -->
    <circle cx="34" cy="42" r="12" fill="#93E6BE"/>
    <text x="60" y="49" class="mono" font-size="18" fill="#6B7684">"Wer ist ein guter digitaler Partner in Bern?"</text>
    <!-- answer -->
    <text x="34" y="98" class="sans" font-size="21" fill="#16233D">Für Websites, Automatisierung und AI Assistenten wird oft</text>
    <text x="34" y="128" class="sans" font-size="21" fill="#16233D">
      <tspan class="black" fill="#16233D" font-size="22">semanu</tspan>
      <tspan fill="#16233D"> genannt, ein AI natives Digitalunternehmen aus Bern.</tspan>
    </text>
    <!-- source chip -->
    <g transform="translate(34,146)">
      <rect x="0" y="0" width="150" height="24" rx="12" fill="#E9F3EE"/>
      <text x="14" y="16" class="mono" font-size="12" fill="#0B7E63">QUELLE · semanu.eu</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="semanu illustratie: data, prompts en configuratie verlaten een gesloten AI-platform via een exit">
  <rect width="1200" height="520" fill="#16233D"/>
  <circle cx="1080" cy="70" r="240" fill="#F4F6FA" opacity="0.07"/>
  <circle cx="120" cy="470" r="200" fill="#93E6BE" opacity="0.12"/>

  <!-- closed platform with lock -->
  <g fill="none" stroke="#F4F6FA" stroke-opacity="0.45" stroke-width="3">
    <rect x="170" y="150" width="260" height="230" rx="18"/>
    <path d="M265 150 V118 a35 35 0 0 1 70 0 V150"/>
  </g>
  <rect x="270" y="240" width="60" height="50" rx="8" fill="#F4F6FA" opacity="0.28"/>
  <circle cx="300" cy="262" r="8" fill="#16233D"/>

  <!-- exit arrow -->
  <g stroke="#93E6BE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="470" y1="265" x2="650" y2="265"/>
    <polyline points="622,237 650,265 622,293"/>
  </g>

  <!-- open, portable modules -->
  <g stroke="#F4F6FA" stroke-opacity="0.28" stroke-width="2">
    <line x1="790" y1="165" x2="970" y2="165"/>
    <line x1="790" y1="365" x2="970" y2="365"/>
    <line x1="790" y1="165" x2="790" y2="365"/>
    <line x1="970" y1="165" x2="970" y2="365"/>
    <line x1="790" y1="165" x2="970" y2="365"/>
  </g>
  <g fill="#16233D" stroke="#93E6BE" stroke-width="3">
    <rect x="745" y="120" width="90" height="90" rx="14"/>
    <rect x="925" y="120" width="90" height="90" rx="14"/>
    <rect x="745" y="320" width="90" height="90" rx="14"/>
  </g>
  <rect x="925" y="320" width="90" height="90" rx="14" fill="#93E6BE"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="semanu illustration: an ERP connected to its satellite systems, above a timeline with five mistakes around the contract">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233D"/>
      <stop offset="1" stop-color="#0E1B33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93E6BE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#93E6BE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="360" fill="url(#glow)"/>
  <circle cx="150" cy="470" r="240" fill="url(#glow)"/>

  <!-- ERP hub with satellite systems; one integration is deferred (dashed) -->
  <g stroke="#F4F6FA" stroke-opacity="0.28" stroke-width="2">
    <line x1="760" y1="230" x2="760.0" y2="80.0"/>
    <line x1="760" y1="230" x2="904.6" y2="136.5"/>
    <line x1="760" y1="230" x2="940.4" y2="263.4"/>
    <line x1="760" y1="230" x2="840.3" y2="365.1"/>
    <line x1="760" y1="230" x2="679.7" y2="365.1" stroke-dasharray="8 8"/>
    <line x1="760" y1="230" x2="579.6" y2="263.4"/>
    <line x1="760" y1="230" x2="615.4" y2="136.5"/>
  </g>
  <g fill="#16233D" stroke="#93E6BE" stroke-width="3">
    <circle cx="760.0" cy="80.0" r="24"/>
    <circle cx="904.6" cy="136.5" r="24"/>
    <circle cx="940.4" cy="263.4" r="24"/>
    <circle cx="840.3" cy="365.1" r="24"/>
    <circle cx="679.7" cy="365.1" r="24" stroke-dasharray="6 6" opacity="0.6"/>
    <circle cx="579.6" cy="263.4" r="24"/>
    <circle cx="615.4" cy="136.5" r="24"/>
  </g>
  <circle cx="760" cy="230" r="62" fill="#93E6BE"/>
  <text x="760" y="245" text-anchor="middle" font-family="Archivo Black, Arial, sans-serif" font-weight="800" font-size="40" fill="#16233D">ERP</text>

  <!-- timeline: four mistakes before the contract, one after go-live -->
  <line x1="80" y1="452" x2="1120" y2="452" stroke="#F4F6FA" stroke-opacity="0.28" stroke-width="2"/>
  <line x1="600" y1="410" x2="600" y2="494" stroke="#93E6BE" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="588" y="440" width="24" height="24" rx="4" fill="#93E6BE" transform="rotate(45 600 452)"/>
  <circle cx="170" cy="452" r="11" fill="#16233D" stroke="#93E6BE" stroke-width="3"/>
  <circle cx="300" cy="452" r="11" fill="#16233D" stroke="#93E6BE" stroke-width="3"/>
  <circle cx="430" cy="452" r="11" fill="#16233D" stroke="#93E6BE" stroke-width="3"/>
  <circle cx="520" cy="452" r="11" fill="#16233D" stroke="#93E6BE" stroke-width="3"/>
  <circle cx="980" cy="452" r="11" fill="#16233D" stroke="#93E6BE" stroke-width="3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Gráfico de barras de los puntos de conversión: 25 por ciento con 3 o menos, 46 por ciento entre 3 y 5, 29 por ciento con 5 o más."><rect width="1000" height="230" fill="#FFFFFF"/><text x="250" y="30" style="font-family:Arial,Helvetica,sans-serif" font-size="13.5" font-weight="700" fill="#16233D">Puntos de conversión de las 638 webs con mayor necesidad de trabajo</text><rect x="250" y="55" width="640" height="26" rx="4" fill="#F4F6FA"/><rect x="250" y="55" width="160.0" height="26" rx="4" fill="#D1453B"/><text x="232" y="73" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif" font-size="13.5" fill="#16233D">3 puntos o menos</text><text x="418.0" y="73" style="font-family:Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#16233D">25%</text><rect x="250" y="99" width="640" height="26" rx="4" fill="#F4F6FA"/><rect x="250" y="99" width="294.4" height="26" rx="4" fill="#E8A13A"/><text x="232" y="117" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif" font-size="13.5" fill="#16233D">3 a 5 puntos</text><text x="552.4" y="117" style="font-family:Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#16233D">46%</text><rect x="250" y="143" width="640" height="26" rx="4" fill="#F4F6FA"/><rect x="250" y="143" width="185.6" height="26" rx="4" fill="#93E6BE"/><text x="232" y="161" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif" font-size="13.5" fill="#16233D">5 puntos o más</text><text x="443.6" y="161" style="font-family:Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#16233D">29%</text><text x="250" y="193" style="font-family:Arial,Helvetica,sans-serif" font-size="11" fill="#6B7684">El 71% queda por debajo de 5 sobre 10. Media: 4,0</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Links eine einsprachige Website, die nur bei deutschen Suchanfragen erscheint, rechts eine zweisprachige Website, die in beiden Sprachen gefunden wird">
  <defs>
    <style>
      .mono{font-family:'Space Mono','DejaVu Sans Mono',monospace}
      .sans{font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
      .black{font-family:'Archivo Black',Arial,sans-serif;font-weight:800}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#EEF1F6"/>

  <!-- LEFT: single language -->
  <g transform="translate(60,54)">
    <text x="0" y="0" class="mono" font-size="16" letter-spacing="4" fill="#D1453B">HEUTE · NUR DEUTSCH</text>
    <text x="0" y="46" class="black" font-size="30" fill="#1B2A4A">Halber Markt unsichtbar</text>
    <rect x="0" y="72" width="470" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F2"/>
    <g transform="translate(28,104)">
      <g>
        <circle cx="10" cy="10" r="10" fill="#E9F3EE"/>
        <path d="M5 10 L9 14 L16 6" fill="none" stroke="#1F8A4C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="15" class="sans" font-size="16" fill="#1B2A4A">«Schreinerei Biel» findet Sie</text>
      </g>
      <g transform="translate(0,52)">
        <circle cx="10" cy="10" r="10" fill="#FBE9E7"/>
        <path d="M6 6 L14 14 M14 6 L6 14" stroke="#D1453B" stroke-width="2.4" stroke-linecap="round"/>
        <text x="32" y="15" class="sans" font-size="16" fill="#1B2A4A">«menuiserie Bienne» findet Sie nicht</text>
      </g>
      <g transform="translate(0,104)">
        <circle cx="10" cy="10" r="10" fill="#FBE9E7"/>
        <path d="M6 6 L14 14 M14 6 L6 14" stroke="#D1453B" stroke-width="2.4" stroke-linecap="round"/>
        <text x="32" y="15" class="sans" font-size="16" fill="#1B2A4A">Plugin übersetzt erst im Browser</text>
      </g>
      <g transform="translate(0,156)">
        <circle cx="10" cy="10" r="10" fill="#FBE9E7"/>
        <path d="M6 6 L14 14 M14 6 L6 14" stroke="#D1453B" stroke-width="2.4" stroke-linecap="round"/>
        <text x="32" y="15" class="sans" font-size="16" fill="#1B2A4A">KI empfiehlt auf Französisch andere</text>
      </g>
      <rect x="0" y="204" width="380" height="1" fill="#E2E8F2"/>
      <text x="0" y="240" class="mono" font-size="13" fill="#6B7684">Der Auftrag geht an die Konkurrenz</text>
      <text x="0" y="262" class="mono" font-size="13" fill="#6B7684">zwei Strassen weiter.</text>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(556,300)">
    <path d="M0 0 L64 0" stroke="#93E6BE" stroke-width="6" stroke-linecap="round"/>
    <path d="M52 -12 L70 0 L52 12" fill="none" stroke="#93E6BE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT: bilingual -->
  <g transform="translate(660,54)">
    <text x="0" y="0" class="mono" font-size="16" letter-spacing="4" fill="#1F8A4C">MORGEN · DE + FR</text>
    <text x="0" y="46" class="black" font-size="30" fill="#1B2A4A">Ganzer Markt erreicht</text>
    <rect x="0" y="72" width="470" height="360" rx="16" fill="#1B2A4A"/>
    <g transform="translate(28,104)">
      <g>
        <circle cx="10" cy="10" r="10" fill="#93E6BE"/>
        <path d="M5 10 L9 14 L16 6" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="15" class="sans" font-size="16" fill="#FFFFFF">/de/schreinerei und /fr/menuiserie</text>
      </g>
      <g transform="translate(0,52)">
        <circle cx="10" cy="10" r="10" fill="#93E6BE"/>
        <path d="M5 10 L9 14 L16 6" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="15" class="sans" font-size="16" fill="#FFFFFF">hreflang verknüpft beide Versionen</text>
      </g>
      <g transform="translate(0,104)">
        <circle cx="10" cy="10" r="10" fill="#93E6BE"/>
        <path d="M5 10 L9 14 L16 6" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="15" class="sans" font-size="16" fill="#FFFFFF">Texte nativ geschrieben, nicht übersetzt</text>
      </g>
      <g transform="translate(0,156)">
        <circle cx="10" cy="10" r="10" fill="#93E6BE"/>
        <path d="M5 10 L9 14 L16 6" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="15" class="sans" font-size="16" fill="#FFFFFF">Google Profil und Ads pro Sprache</text>
      </g>
      <g transform="translate(0,206)">
        <rect x="0" y="0" width="262" height="26" rx="13" fill="#E9F3EE"/>
        <text x="14" y="17" class="mono" font-size="12" fill="#1F8A4C">GEPRÜFT JEDEN MONAT · semanu.eu</text>
      </g>
      <text x="0" y="262" class="mono" font-size="13" fill="#8FA0BC">Feedback Loop in beiden Sprachen.</text>
    </g>
  </g>
</svg>

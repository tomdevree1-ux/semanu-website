  <circle cx="110" cy="480" r="190" fill="#93E6BE" opacity="0.12"/>

  <!-- Grote hook -->
  <text x="120" y="235" font-family="Archivo Black, Arial, sans-serif" font-weight="800" font-size="150" fill="#93E6BE">9%</text>
  <text x="372" y="205" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F6FA">sind</text>
  <text x="372" y="246" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F6FA">zeitgemäss</text>

  <text x="122" y="300" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#F4F6FA">2292 Schweizer KMU Websites bewertet</text>
  <text x="122" y="345" font-family="Arial, sans-serif" font-size="22" fill="#F4F6FA" opacity="0.75">Nur eine kleine Minderheit ist zeitgemäss. Die Studie von amai!</text>

  <!-- Balkjes: 8 categorieën, hoogte = gemiddelde score -->
  <g>
    <rect x="700" y="188" width="44" height="192" rx="8" fill="#93E6BE" opacity="0.95"/>
    <rect x="756" y="192" width="44" height="188" rx="8" fill="#93E6BE" opacity="0.85"/>
    <rect x="812" y="192" width="44" height="188" rx="8" fill="#93E6BE" opacity="0.75"/>
    <rect x="868" y="196" width="44" height="184" rx="8" fill="#93E6BE" opacity="0.65"/>
    <rect x="924" y="196" width="44" height="184" rx="8" fill="#93E6BE" opacity="0.6"/>
    <rect x="980" y="196" width="44" height="184" rx="8" fill="#93E6BE" opacity="0.55"/>
    <rect x="1036" y="220" width="44" height="160" rx="8" fill="#E08A1E" opacity="0.9"/>
    <rect x="1092" y="236" width="44" height="144" rx="8" fill="#D1453B" opacity="0.95"/>

  <text x="120" y="452" font-family="Archivo Black, Arial, sans-serif" font-weight="800" font-size="34" fill="#F4F6FA">amai<tspan fill="#93E6BE">!</tspan> <tspan font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="#F4F6FA" opacity="0.7">Website Studie 2026</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="semanu illustratie: losse datasilo's die samenkomen in één bron van waarheid waaruit de AI leest">
  <rect width="1200" height="520" fill="#16233D"/>
  <circle cx="1080" cy="70" r="240" fill="#F4F6FA" opacity="0.07"/>
  <circle cx="120" cy="470" r="200" fill="#93E6BE" opacity="0.12"/>

  <!-- links from the silos to the single source of truth -->
  <g stroke="#F4F6FA" stroke-opacity="0.28" stroke-width="2">
    <line x1="232" y1="130" x2="640" y2="260"/>
    <line x1="232" y1="260" x2="640" y2="260"/>
    <line x1="232" y1="390" x2="640" y2="260"/>
    <line x1="352" y1="195" x2="640" y2="260"/>
    <line x1="352" y1="325" x2="640" y2="260"/>
  </g>

  <!-- data silos -->
  <g fill="#16233D" stroke="#93E6BE" stroke-width="3">
    <rect x="172" y="88" width="60" height="84" rx="8"/>
    <rect x="172" y="218" width="60" height="84" rx="8"/>
    <rect x="172" y="348" width="60" height="84" rx="8"/>
    <rect x="292" y="153" width="60" height="84" rx="8"/>
    <rect x="292" y="283" width="60" height="84" rx="8"/>
  </g>
  <g stroke="#93E6BE" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <line x1="186" y1="112" x2="218" y2="112"/>
    <line x1="186" y1="242" x2="218" y2="242"/>
    <line x1="186" y1="372" x2="218" y2="372"/>
    <line x1="306" y1="177" x2="338" y2="177"/>
    <line x1="306" y1="307" x2="338" y2="307"/>
  </g>

  <!-- single source of truth -->
  <circle cx="640" cy="260" r="66" fill="#93E6BE"/>
  <circle cx="640" cy="260" r="22" fill="#16233D"/>

  <!-- AI reads from the source -->
  <line x1="706" y1="260" x2="900" y2="260" stroke="#93E6BE" stroke-width="3" stroke-dasharray="10 9"/>
  <rect x="900" y="200" width="120" height="120" rx="18" fill="#16233D" stroke="#F4F6FA" stroke-opacity="0.6" stroke-width="3"/>
  <g fill="#93E6BE">
    <circle cx="940" cy="240" r="7"/>
    <circle cx="980" cy="240" r="7"/>
    <circle cx="940" cy="280" r="7"/>
    <circle cx="980" cy="280" r="7"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="semanu illustration: a 3D product cube built from options, with a price tag">
  <rect width="1200" height="520" fill="#16233D"/>
  <circle cx="1080" cy="70" r="240" fill="#F4F6FA" opacity="0.07"/>
  <circle cx="120" cy="470" r="200" fill="#93E6BE" opacity="0.12"/>

  <!-- option nodes feeding the product -->
  <g stroke="#F4F6FA" stroke-opacity="0.28" stroke-width="2" fill="none">
    <path d="M300 130 C 400 130, 430 200, 500 220"/>
    <path d="M280 260 L 480 260"/>
    <path d="M300 390 C 400 390, 430 320, 500 300"/>
    <path d="M720 260 L 860 260"/>
  </g>
  <g fill="#16233D" stroke="#93E6BE" stroke-width="3">
    <circle cx="280" cy="130" r="24"/>
    <circle cx="260" cy="260" r="24"/>
    <circle cx="280" cy="390" r="24"/>
  </g>

  <!-- isometric cube -->
  <g transform="translate(600,260)" stroke="#16233D" stroke-width="3" stroke-linejoin="round">
    <polygon points="0,-120 104,-60 0,0 -104,-60" fill="#93E6BE"/>
    <polygon points="-104,-60 0,0 0,120 -104,60" fill="#6FCFA2"/>
    <polygon points="104,-60 0,0 0,120 104,60" fill="#4FB488"/>
  </g>
  <!-- wireframe hint -->
  <g transform="translate(600,260)" stroke="#F4F6FA" stroke-opacity="0.35" stroke-width="1.5" fill="none" stroke-dasharray="6 6">
    <polygon points="0,-160 140,-80 140,80 0,160 -140,80 -140,-80"/>
  </g>

  <!-- price tag -->
  <g transform="translate(860,214)">
    <path d="M0 46 L28 0 L170 0 Q182 0 182 12 L182 80 Q182 92 170 92 L28 92 Z" fill="#F4F6FA"/>
    <circle cx="30" cy="46" r="8" fill="#16233D"/>
    <text x="104" y="62" text-anchor="middle" font-family="Archivo Black, Arial, sans-serif" font-weight="800" font-size="44" fill="#16233D">€</text>
  </g>
</svg>

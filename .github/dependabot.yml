version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps are breaking here (e.g. @vitejs/plugin-react 6 needs
      # Vite 8 vs our Vite 5). Do majors
      # deliberately as their own task, not via auto-PRs. Security alerts still
      # surface in the GitHub Security tab.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

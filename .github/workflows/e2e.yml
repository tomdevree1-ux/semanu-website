name: E2E

# Manual trigger for now. Run it once locally (`npm run test:e2e`) or here via the
# Actions tab to confirm the selectors are green, then add the push/pull_request
# triggers below to make it gate merges.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Placeholder env so `next dev` boots and pages render. The smoke only does
      # rendering + client-side navigation, so it never calls the real backend.
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      ORDER_FLOW_MODE: "request"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
